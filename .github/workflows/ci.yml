# What `main` has to pass: the shim built and smoke-tested against the CPU
# libtorch, the package's tests on each of Meadow's runtimes, and the
# formatter with nothing to change. Meadow is the nightly.
#
# It runs on every pull request, and on the merge queue's own commit -- the
# branch as it will be once it is on `main` -- so nothing reaches
# `main` that was not tested as it will have it. `main` takes pull
# requests only, and this check is required of them.

name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Meadow (nightly)
        # The installer asks GitHub's API for the release; with a token it is
        # not held to the limit on unauthenticated requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/meadow-lang/meadow/master/scripts/meadowup-init.sh | sh -s -- --version nightly
          echo "$HOME/.meadow/bin" >> "$GITHUB_PATH"

      - name: Install libtorch (CPU)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/libtorch.zip" "https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.14.1%2Bcpu.zip"
          unzip -q "$RUNNER_TEMP/libtorch.zip" -d "$RUNNER_TEMP"
          echo "LIBTORCH=$RUNNER_TEMP/libtorch" >> "$GITHUB_ENV"

      - name: Build the shim
        # Built, and its C smoke test run, against that libtorch; the Meadow
        # code finds it through `MEADOW_TORCH_LIB`.
        run: |
          sh shim/build.sh test
          echo "MEADOW_TORCH_LIB=$PWD/shim/build/libmeadow_torch.so" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          meadow --version
          clang --version

      - name: Format
        run: meadow fmt --check src

      - name: Test (Glade)
        run: meadow test
      - name: Test (Silo)
        run: meadow test --runtime silo
